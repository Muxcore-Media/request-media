name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GOPROXY: https://proxy.golang.org,direct

jobs:
  test:
    runs-on: native
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          path: request-media
      - name: Checkout workspace peers
        run: |
          set -euo pipefail
          for repo in core contracts-automation contracts-media contracts-metadata contracts-scanner \
            media-automation media-audiobooks media-books media-comics media-movies media-music \
            media-tvshows metadata-musicbrainz metadata-tmdb; do
            git clone --depth 1 https://git.zem.systems/muxcore/${repo}.git "$repo"
          done
      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
          echo "$HOME/.local/go/bin" >> "$GITHUB_PATH"
      - name: Fetch MuxCore modules from Forgejo origin
        run: |
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$HOME/.local/bin" v2.1.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - working-directory: request-media
        run: golangci-lint run --timeout 120s ./...
      - working-directory: request-media
        run: go test -race -count=1 -timeout 10m ./...

  build:
    runs-on: native
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          path: request-media
      - name: Checkout workspace peers
        run: |
          set -euo pipefail
          for repo in core contracts-automation contracts-media contracts-metadata contracts-scanner \
            media-automation media-audiobooks media-books media-comics media-movies media-music \
            media-tvshows metadata-musicbrainz metadata-tmdb; do
            git clone --depth 1 https://git.zem.systems/muxcore/${repo}.git "$repo"
          done
      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
          echo "$HOME/.local/go/bin" >> "$GITHUB_PATH"
      - name: Fetch MuxCore modules from Forgejo origin
        run: |
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
      - working-directory: request-media
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
